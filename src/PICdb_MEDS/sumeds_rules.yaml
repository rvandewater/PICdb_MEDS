# suMEDS enrichment rules for PICdb MEDS codes (format `sumeds-rules/0.1`).
#
# The ETL writes what PIC's own dictionaries carry: English labels, `ICD10/` parents from
# `D_ICD_DIAGNOSES.ICD10_CODE` and `LOINC/` parents from `D_LABITEMS.LOINC_CODE`. External-ontology
# work is left to suMEDS (https://github.com/rvandewater/SumMEDS), which applies this file to
# `metadata/codes.parquet`:
#
#     suMEDS-enrich $MEDS_ROOT/metadata/codes.parquet -o codes-enriched.parquet \
#       --rules src/PICdb_MEDS/sumeds_rules.yaml
#
# Patterns match the code layouts in `event_configs.yaml`:
#
#     DIAGNOSIS//ICD10_CN//{ICD10_CODE_CN}
#     ADMISSION_DIAGNOSIS//ICD10_CN//{ICD10_CODE_CN}
#
# `tests/test_sumeds_rules.py` checks every rule against codes built from those layouts.
schema: sumeds-rules/0.1

ontology:
  # PIC codes neoplasm morphology in the Chinese edition of ICD-O-3 (Zeng et al., Sci Data 2020,
  # doi:10.1038/s41597-020-0355-4, Table 1, CC BY 4.0). These codes are `M` + five digits + `/` +
  # the behaviour digit (`M80000/3`). The fifth digit is the Chinese extension, so dropping the
  # `M` and that digit gives the OMOP ICDO3 histology code (`8000/3`). suMEDS's versioned ontology
  # data (sumeds-ontologies, pinned release) has no ICD-O-3 pack, as it may not be redistributed, so
  # the code is only tagged (`ICDO3//8000/3`). It is validated when Athena is configured.
  - id: picdb-icdo3-morphology
    pattern: "^(?:ADMISSION_)?DIAGNOSIS//ICD10_CN//(?P<code>M[89][0-9]{4}/[0-9])$"
    vocabulary: ICDO3
    normalize:
      - { pattern: "^M([89][0-9]{3})[0-9]/([0-9])$", replace: '\1/\2' }
    validate: none

hierarchy:
  # Same-dataset parents: the nearest shorter code of the same family, skipping dots, e.g.
  # `DIAGNOSIS//ICD10_CN//A18.000+` gets `DIAGNOSIS//ICD10_CN//A18.000` when that code exists.
  # Only ICD-10-shaped codes (letter, two digits, optional dot extension, optional dagger `+`) are
  # truncated, so a morphology code such as `M80000/3` never falls under ICD-10 chapter M codes.
  - id: picdb-diagnosis-prefix
    pattern: '^(?P<prefix>DIAGNOSIS//ICD10_CN//)(?P<code>[A-Z][0-9]{2}(?:\.[0-9A-Za-z]+)?\+?)$'
    group: code
    mode: prefix
    ignore: "."
  - id: picdb-admission-diagnosis-prefix
    pattern: '^(?P<prefix>ADMISSION_DIAGNOSIS//ICD10_CN//)(?P<code>[A-Z][0-9]{2}(?:\.[0-9A-Za-z]+)?\+?)$'
    group: code
    mode: prefix
    ignore: "."
